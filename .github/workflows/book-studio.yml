name: Book Studio

on:
  push:
    paths: ["book-studio/**", ".github/workflows/book-studio.yml"]
  pull_request:
    paths: ["book-studio/**", ".github/workflows/book-studio.yml"]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres 16
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16
      - name: Migrations and security tests
        run: book-studio/supabase/tests/run.sh

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: book-studio/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book-studio/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  functions:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: book-studio/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check ai/index.ts team/index.ts billing/index.ts stripe-webhook/index.ts
